<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTMLScope · HTML 標註閱讀器</title>
<style>
:root{--bg:#f6f7f6;--surface:#fff;--ink:#20282b;--ink2:#5a6a6e;--line:#dde3e1;--accent:#0e7b6c;--accent-soft:#e3f0ed;--chip:#eef1f0;--danger:#b4372e}
@media (prefers-color-scheme: dark){:root{--bg:#15191a;--surface:#1d2224;--ink:#e6eae8;--ink2:#9fb0ac;--line:#323a3b;--accent:#3bb89f;--accent-soft:#1c322d;--chip:#272e2f;--danger:#e07a70}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;font-size:14px}
/* flex-wrap + min-width:0 :英文介面標籤較長時會換行,不會把語言鈕擠出畫面外(實測有人以為切不回中文) */
#topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
#topbar .logo{font-weight:800;white-space:nowrap}
#docName{color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:60px}
#topbar button{font-size:13px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#topbar button:hover{border-color:var(--accent);color:var(--accent)}
#topbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#topbar button.primary:hover{color:#fff;filter:brightness(1.1)}
#topbar button[hidden]{display:none}
#home{flex:1;overflow-y:auto;padding:32px 20px}
#home .inner{max-width:640px;margin:0 auto}
#drop{border:2px dashed var(--line);border-radius:14px;padding:48px 24px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--surface);transition:border-color .15s}
#drop:hover,#drop.over{border-color:var(--accent);color:var(--accent)}
#drop .big{font-size:17px;font-weight:700;margin-bottom:6px}
#recents{margin-top:26px}
#recents .rec-head{display:flex;align-items:center;gap:10px;margin:0 0 8px}
#recents h3{font-size:14px;margin:0;color:var(--ink2);flex:1}
#recents .clearall{background:none;border:1px solid var(--line);border-radius:7px;color:var(--ink2);cursor:pointer;font-size:12px;padding:4px 9px}
#recents .clearall:hover{border-color:var(--danger);color:var(--danger)}
#recents .rec-hint{color:var(--ink2);font-size:12px;line-height:1.6;margin:0 0 12px}
.rec{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.rec:hover{border-color:var(--accent)}
.rec .nm{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .meta{color:var(--ink2);font-size:12px;white-space:nowrap}
.rec .del{background:none;border:none;color:var(--ink2);cursor:pointer;font-size:15px;padding:2px 6px}
.rec .del:hover{color:var(--danger)}
.rec .nofile{color:var(--ink2);font-size:12px}
#tips{margin-top:26px;color:var(--ink2);font-size:12.5px;line-height:1.8;background:var(--accent-soft);border:1px solid var(--line);border-radius:9px;padding:12px 16px}
#tips p{margin:0 0 8px}
#tips h4{margin:16px 0 6px;font-size:13px;color:var(--ink)}
#tips h4:first-child{margin-top:4px}
#tips ul{margin:0 0 4px;padding-left:20px}
#tips li{margin:5px 0}
#tips summary{cursor:pointer;font-weight:700;color:var(--ink);padding:5px 0}
#tips summary:hover{color:var(--accent)}
#tips details{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
/* 說明分層:示意圖不用點開就看得到(7/7 使用者反映「一大片條列,掃兩段就放棄」),
   文字說明拆成 基本／進階／疑難 三段漸進式展開,技術細節不再擋在必讀路徑上 */
#tips .g30{margin:4px 0 2px;font-weight:700;color:var(--ink)}
#tips details summary .cnt{font-weight:400;color:var(--ink2);font-size:12px}
/* 使用說明的小示意圖:純 HTML/CSS(無外部圖檔),隨主題自動配色 */
.ug-flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0 4px}
.ug-box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:10.5px;color:var(--ink2);line-height:1.5}
.ug-arrow{color:var(--ink2);font-size:13px;flex:none;text-align:center}
.ug-cap{font-size:11px;color:var(--ink2);margin:0 0 14px}
.ug-doc mark{background:rgba(242,196,20,.42);color:inherit;border-radius:2px;padding:0 2px}
.ug-bar{display:flex;gap:4px;padding:8px 9px}
.ug-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.ug-pop{width:108px}
.ug-q{color:var(--ink2);font-size:9.5px;margin-bottom:5px}
.ug-ta{height:14px;background:var(--chip);border-radius:4px;margin-bottom:5px}
.ug-sendbtn{background:var(--accent);color:#fff;border-radius:4px;padding:2px 8px;font-size:9.5px;display:inline-block;float:right}
.ug-person{text-align:center;min-width:74px}
.ug-who{font-weight:700;color:var(--ink);font-size:11px;margin-bottom:4px}
.ug-fico{font-size:15px;letter-spacing:1px}
.ug-merge{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
/* 「我沒有 HTML 檔」入口:實測一般職員與大學生的文件都在 Word／Google Docs／PDF,
   landing 與工具都沒交代怎麼取得 HTML 檔 —— 這是還沒進門就被擋掉的第一道牆。
   除了教怎麼轉檔,更直接提供「貼上文字」讓人完全跳過轉檔這一步。 */
#noFileRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:14px}
#noFileRow button{font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
#noFileRow button:hover{border-color:var(--accent);color:var(--accent)}
#noFileRow button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#noFileRow button.primary:hover{color:#fff;filter:brightness(1.08)}
#howto{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;color:var(--ink2);font-size:12.5px;line-height:1.75}
#howto[hidden]{display:none}
#howto h4{margin:0 0 8px;font-size:13px;color:var(--ink)}
#howto dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
#howto dt{font-weight:700;color:var(--ink);white-space:nowrap}
#howto dd{margin:0}
#howto .tip{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);color:var(--ink)}
#howto .tip-top{margin:0 0 12px;padding:11px 13px;background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#howto .tip-top span{flex:1 1 200px}
#howto .tip-top button{flex:none;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
#howto .conv-label{margin:0 0 6px;font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
#pasteOv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
#pasteOv[hidden]{display:none}
#pasteBox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
#pasteBox .ph{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink)}
#pasteBox .px{margin-left:auto;background:none;border:none;color:var(--ink2);font-size:14px;cursor:pointer;padding:4px 8px}
#pasteBox .px:hover{color:var(--danger)}
#pasteBox .pdesc{padding:10px 16px 0;color:var(--ink2);font-size:12px;line-height:1.55}
#pasteBox .pttl{margin:10px 16px 0;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
#pasteBox .pttl input{flex:1;min-width:0;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px}
#pasteBox textarea{flex:1;margin:10px 16px;min-height:190px;resize:vertical;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:13px;line-height:1.6}
#pasteBox .pf{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
#pasteBox .pf .sp{margin-left:auto}
#pasteBox .pf button{font-size:13px;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
#pasteBox .pf button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#pasteBox .pf button.primary:hover{filter:brightness(1.08)}
#pasteBox .pf .perr{color:var(--danger);font-size:12px}
#view{flex:1;width:100%;border:none;background:#fff;display:none}
body.reading #home{display:none}
body.reading #view{display:block}
</style>
</head>
<body>
<header id="topbar">
  <span class="logo">📖 HTMLScope <span style="font-size:11px;color:var(--ink2);font-weight:400" id="logoSub"></span></span>
  <span id="docName"></span>
  <button id="btnHome" hidden></button>
  <button id="btnOpen"></button>
  <button id="btnLang"></button>
</header>

<div id="home">
  <div class="inner">
    <div id="drop">
      <div class="big" id="dropBig"></div>
      <div id="dropSub"></div>
    </div>
    <div id="noFileRow">
      <button id="btnPaste" class="primary"></button>
      <button id="btnHowto"></button>
    </div>
    <div id="howto" hidden></div>
    <div id="recents"></div>
    <div id="tips"></div>
  </div>
</div>

<iframe id="view"></iframe>
<input type="file" id="fileIn" accept=".html,.htm,text/html" hidden>

<div id="pasteOv" hidden><div id="pasteBox">
  <div class="ph"><span class="ptitle"></span><button class="px">✕</button></div>
  <div class="pdesc"></div>
  <div class="pttl"><span class="pttllab"></span><input id="pasteName" type="text" maxlength="80"></div>
  <textarea id="pasteTA"></textarea>
  <div class="pf"><span class="perr"></span><span class="sp"></span><button class="pcancel"></button><button class="pgo primary"></button></div>
</div></div>

<script>
/* ================= 標註引擎（會被注入到文件 iframe / 傳閱版檔案裡） ================= */
var ENGINE_CSS = [
/* 深淺色自動切換:UI 全部走這組變數 */
'#annoBar,#annoPop,#annoPanel,#annoToggle,#annoStaticApp,#annoPromptOverlay,#annoDiffOverlay,#annoToast,.anno-menu{--as:#fff;--atx:#222;--amut:#888;--aln:#ccc;--achip:#f0f0f0;--amsg:#f4f4f4;--aacc:#0e7b6c;--adelb:#fdeceb;--adelt:#b4372e}',
'@media (prefers-color-scheme: dark){#annoBar,#annoPop,#annoPanel,#annoToggle,#annoStaticApp,#annoPromptOverlay,#annoDiffOverlay,#annoToast,.anno-menu{--as:#23282a;--atx:#e6eae8;--amut:#9aa8a4;--aln:#454c4e;--achip:#2e3436;--amsg:#2b3133;--aacc:#3bb89f;--adelb:#3a201d;--adelt:#e07a70}}',
'#annoBar[hidden],#annoPanel[hidden],#annoPop[hidden]{display:none!important}',
'mark.anno{background:transparent;color:inherit;cursor:pointer;border-radius:2px;padding:0 1px}',
'mark.anno:hover{filter:brightness(.9)}',
'mark.anno.c-y{background:rgba(255,205,0,.38)}',
'mark.anno.c-r{background:rgba(240,85,60,.32)}',
'mark.anno.c-g{background:rgba(50,200,120,.30)}',
'mark.anno.c-b{background:rgba(80,150,255,.30)}',
'mark.anno.note{border-bottom:2px dotted #888}',
'mark.anno.note::after{content:"📝";font-size:10px;vertical-align:super;margin-left:1px}',
'mark.anno.approx{border-bottom:2px dashed #b88a2e}',
'mark.anno.approx::before{content:"≈";font-size:9px;vertical-align:super;color:#b88a2e;margin-right:1px}',
'mark.anno.flash{outline:2px solid #0e7b6c;outline-offset:1px}',
'#annoBar,#annoPop,#annoPanel,#annoToggle{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6;color:var(--atx)}',
'#annoBar{position:fixed;z-index:2147483000;display:flex;gap:5px;background:var(--as);border:1px solid var(--aln);border-radius:999px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.25)}',
'@media (prefers-reduced-motion: no-preference){#annoBar{transition:opacity .14s ease,transform .14s ease}}',
'#annoBar button,#annoPop .ap-colors button{display:flex;align-items:center;gap:4px;width:auto;height:auto;min-width:0;min-height:0;border-radius:999px;border:1px solid var(--aln);background:var(--achip);color:var(--atx);cursor:pointer;padding:3px 9px;font-size:12px;white-space:nowrap;line-height:1.6}',
'#annoBar button:hover,#annoPop .ap-colors button:hover{border-color:var(--aacc);color:var(--aacc)}',
'.bdot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}',
'.bdot.c-y,.dot.c-y{background:#f2c414}',
'.bdot.c-r,.dot.c-r{background:#e4574a}',
'.bdot.c-g,.dot.c-g{background:#3cb878}',
'.bdot.c-b,.dot.c-b{background:#4a90e2}',
'#annoPop{position:fixed;z-index:2147483001;width:300px;background:var(--as);border:1px solid var(--aln);border-radius:10px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.3);font-size:13px}',
'#annoPop .ap-drag{display:flex;align-items:center;justify-content:space-between;cursor:move;color:var(--amut);font-size:12px;margin:-6px -6px 4px;padding:0 0 0 4px;user-select:none;touch-action:none}',
'#annoPop .ap-close{background:none;border:none;color:var(--amut);cursor:pointer;font-size:13px;padding:2px 8px}',
'#annoPop .ap-close:hover{color:var(--adelt)}',
'#annoPop .ap-quote{color:var(--amut);font-size:12px;margin-bottom:8px;max-height:60px;overflow:auto}',
'#annoPop textarea{width:100%;min-height:64px;resize:vertical;background:var(--achip);color:var(--atx);border:1px solid var(--aln);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;box-sizing:border-box}',
'#annoPop .ap-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}',
'#annoPop .ap-colors{display:flex;flex-wrap:wrap;gap:4px;margin-right:auto}',
'#annoPop .ap-colors button{padding:2px 7px;font-size:11.5px}',
'#annoPop .ap-colors button.sel{border-color:var(--atx);font-weight:700}',
'#annoPop .ap-del,#annoPop .ap-save{font-size:12.5px;border-radius:6px;padding:4px 12px;cursor:pointer;border:1px solid var(--aln)}',
'#annoPop .ap-del{background:var(--adelb);color:var(--adelt)}',
'#annoPop .ap-save{background:var(--aacc);color:#fff;border-color:var(--aacc)}',
/* 署名列:內嵌在留言視窗裡,不用瀏覽器 prompt(在部分環境會被擋掉,實測 6/6 使用者因此永遠掛「匿名」) */
'#annoPop .ap-who{display:flex;align-items:center;gap:6px;margin:0 0 7px;font-size:12px;color:var(--amut)}',
'#annoPop .ap-whoin{flex:1;min-width:0;background:var(--achip);color:var(--atx);border:1px solid var(--aln);border-radius:6px;padding:3px 7px;font:inherit;font-size:12.5px}',
'#annoPop .ap-whoin:focus{border-color:var(--aacc);outline:none}',
'#annoPop .ap-who.need .ap-whoin{border-color:var(--adelt);background:var(--adelb)}',
'#annoPop .ap-who.need .ap-wholab{color:var(--adelt);font-weight:700}',
'#annoPop .ap-sug{margin:2px 0 8px}',
'#annoToast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:2147483003;background:var(--as);color:var(--atx);border:1px solid var(--aacc);border-radius:9px;padding:10px 16px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:min(460px,calc(100vw - 32px));text-align:left}',
'#annoToast[hidden]{display:none!important}',
'#annoToast b{color:var(--aacc)}',
'#annoPop .ap-sugtoggle{font-size:12px;background:none;border:1px dashed var(--aln);color:var(--amut);border-radius:6px;padding:3px 9px;cursor:pointer;width:100%;text-align:left}',
'#annoPop .ap-sugtoggle:hover{border-color:var(--aacc);color:var(--aacc)}',
'#annoPop .ap-sugta{width:100%;min-height:48px;resize:vertical;background:var(--achip);color:var(--atx);border:1px solid var(--aacc);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;box-sizing:border-box}',
'#annoPop .ap-sugrow{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}',
'#annoPop .ap-sugrow button{font-size:12px;border-radius:6px;padding:4px 10px;cursor:pointer;border:1px solid var(--aln);background:var(--achip);color:var(--atx)}',
'#annoPop .ap-sugsave,#annoPop .ap-sugaccept{background:var(--aacc);color:#fff;border-color:var(--aacc)}',
'#annoPop .ap-sugaccept[disabled]{opacity:.4;cursor:not-allowed}',
'#annoPop .ap-sugview,#annoPop .ap-sugdone{border:1px solid var(--aln);border-radius:6px;padding:6px 8px;background:var(--achip)}',
'#annoPop .ap-sugdone{border-color:var(--aacc)}',
'#annoPop .ap-sugtext{font-size:12.5px;color:var(--atx);margin-bottom:2px;word-break:break-word}',
/* 建議的新舊對照(複用版本比對的 diff 引擎):刪除線=原文、底線=改成的字。
   實測會計/大學生都要求「看得出哪幾個字被動了」,不要只丟一整段新字串讓人自己比對 */
'#annoPop .ap-sugdiff,#annoPop .ap-sugdiff2{font-size:12.5px;line-height:1.7;margin:4px 0 2px;word-break:break-word;white-space:pre-wrap}',
'#annoPop .ap-sugnote{font-size:11px;color:var(--amut);line-height:1.45;margin:4px 0 0}',
'#annoPop .ap-donelab{font-size:12px;color:var(--aacc);font-weight:700;margin-bottom:2px}',
'#annoPop .ap-donemeta{font-size:11px;color:var(--amut);margin-top:3px}',
'mark.anno.sug{border-bottom:2px solid var(--sugc,#0e7b6c)}',
'.ap-item.sug .badge{display:inline-block;font-size:10px;color:#0e7b6c;border:1px solid #0e7b6c;border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}',
'.ap-item .sugline{color:#0e7b6c;font-size:12px;margin-top:2px}',
'#annoToggle{position:fixed;right:18px;bottom:18px;z-index:2147482999;background:var(--aacc);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}',
'#annoPanel{position:fixed;right:18px;bottom:64px;z-index:2147482999;width:350px;max-height:62vh;overflow:hidden;display:flex;flex-direction:column;background:var(--as);border:1px solid var(--aln);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px;color:var(--atx)}',
'#annoPanel .ap-head{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:10px 12px;border-bottom:1px solid var(--aln);font-weight:700}',
'#annoPanel .ap-head .sp{margin-right:auto}',
'#annoPanel .ap-head button{font-size:12px;background:var(--achip);border:1px solid var(--aln);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--atx);white-space:nowrap;flex:none}',
/* min-height:一打開面板就要看得到標註本身,不能被上方的引導條/篩選列擠成一條縫(實測有人以為留言沒存到) */
/* box-sizing 要自己指定:ENGINE_CSS 注入的是「使用者的文件」,而盒模型跟著那份文件走。沒有 *{box-sizing:border-box} 的文件裡,min-height:96 是內容高,再加上下 padding 12 變成 108,面板的 flex 分配就會多出 10px,把底部說明擠出面板外緣(實測溢出 9.6px)。 */
'#annoList{overflow-y:auto;padding:6px;flex:1 1 auto;min-height:96px;box-sizing:border-box}',

function migrate(a){

  if(a.resolved === undefined) a.resolved = false;

annos.forEach(migrate);

function tombs(){ try{ return JSON.parse(localStorage.getItem(KEY + '::del') || '[]'); }catch(e){ return []; } }
function addTombs(ids){ try{ var t = tombs(); ids.forEach(function(i){ if(t.indexOf(i) < 0) t.push(i); }); localStorage.setItem(KEY + '::del', JSON.stringify(t)); }catch(e){} }
/* 合併外來標記:同一條標註的留言逐則合併,誰的話都不會被蓋掉 */
function mergeIn(arr, ignoreTombs){
  if(arr && !Array.isArray(arr)) arr = Array.isArray(arr.annotations) ? arr.annotations : null;
  if(!Array.isArray(arr)) return;
  var dead = {}; if(!ignoreTombs) tombs().forEach(function(i){ dead[i] = 1; });
  var map = {}; annos.forEach(function(a){ map[a.id] = a; });
  arr.forEach(function(inc){
    if(!inc || inc.quote == null || dead[inc.id]) return;
    migrate(inc);
    var cur = map[inc.id];
    if(!cur){ annos.push(inc); map[inc.id] = inc; return; }
    var mids = {}; cur.thread.forEach(function(m){ mids[m.id] = 1; });
    inc.thread.forEach(function(m){ if(m && !mids[m.id]) cur.thread.push(m); });

/* 列印:標記處加編號上標,文末附「標註註解」對照表(印完自動移除) */
var printAdded = [];
window.addEventListener('beforeprint', function(){

     不清的話連按兩次列印會疊出兩份對照表與兩組編號。 */
  printAdded.forEach(function(el){ el.remove(); }); printAdded = [];
  markPrintTheme();
  var icons = { y:'🟡', r:'🔴', g:'🟢', b:'🔵' };
  var sorted = annos.filter(function(a){ return !a.orphan && a.thread.length; }).sort(function(a,b){ return a.start - b.start; });

  sorted.forEach(function(a, i){
    var ms = document.querySelectorAll('mark.anno[data-id="' + a.id + '"]');
    if(ms.length){
      var host = ms[ms.length - 1];
      if(!host.closest('svg')){                            /* sup 會中斷 SVG 解析,絕不放進去 */
        var sup = document.createElement('sup');
        sup.className = 'annoPrintNo'; sup.textContent = '[' + (i+1) + ']';
        host.appendChild(sup); printAdded.push(sup); } }
    var d = document.createElement('div'); d.style.cssText = 'margin:8px 0;font-size:12px';
    var head = document.createElement('b');
    head.textContent = '[' + (i+1) + '] ' + icons[a.color] + (a.resolved ? T.resolvedParen : '') + '「' + a.quote.slice(0,40) + (a.quote.length > 40 ? '…' : '') + '」';
    d.appendChild(head);

/* 深色文件列印補償:量文件實際的底色,只有偏暗時才掛上 anno-print-light。
   量的是 body 往上疊出來的有效底色(很多文件把顏色放在 body 而不是 html)。 */
function markPrintTheme(){
  var dark = false;
  try{
    var el = document.body, bg = null;
    while(el){
      var c = getComputedStyle(el).backgroundColor;
      var m = c && c.match(/[\d.]+/g);
      if(m && (m.length < 4 || parseFloat(m[3]) > 0.5)){ bg = m; break; }
      el = el.parentElement;
    }
    if(bg){
      var f = function(v){ v = v/255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
      var L = 0.2126*f(+bg[0]) + 0.7152*f(+bg[1]) + 0.0722*f(+bg[2]);
      dark = L < 0.35;                       /* 底色偏暗 → 文字必然是淺色,印在白紙上會消失 */
    }
  }catch(e){}
  document.documentElement.classList.toggle('anno-print-light', dark);
}

function buildMarkdown(){

function buildPrompt(){

  if(!open.length) return null;
  var parts = [ F(T.pmIntro, { name: NAME, n: open.length }) ];
  open.forEach(function(a, i){
    var cat = T.cn[a.color] + T.sep + annoLabel(a);
    var s = '\n### ' + T.pmNoteWord + ' ' + (i+1) + ' — ' + cat + (a.orphan ? ' ⚠' : '') + '\n';
    s += T.pmLblMarked + T.sep + '"' + a.quote + '"\n';
    s += T.pmLblContext + T.sep + '…' + (a.prefix || '') + '〖' + a.quote + '〗' + (a.suffix || '') + '…\n';
    if(a.suggestion) s += T.sugLabel + T.sep + '"' + a.suggestion + '"\n';
    if(a.thread.length){
      s += T.pmLblComments + T.sep + '\n';
      a.thread.forEach(function(m){
        s += '- ' + (m.author || T.anon) + (m.ts ? ' (' + new Date(m.ts).toLocaleString(T.dl) + ')' : '') + T.sep + m.text + '\n'; });
    } else if(!a.suggestion){ s += T.pmLblComments + T.sep + F(T.pmNoComments, { cat: annoLabel(a) }) + '\n'; }
    parts.push(s); });

/* 🔍 版本比對:記錄一個「基準版本」的全文快照,之後跟目前全文比較,顯示 AI(或你自己)這一輪改了什麼。
   基準會在①第一次開啟文件、②每次產生修改指令時自動存(存的是「送去給 AI 之前」的樣子);
   純本機、不烙進傳閱版 —— 這是個人編修輔助,不是跨人協作資料。 */
var BASE_KEY = KEY + '::baseline';
function saveBaseline(){ try{ localStorage.setItem(BASE_KEY, JSON.stringify({ text: fullText(), ts: Date.now() })); }catch(e){} }
function loadBaseline(){ try{ var raw = localStorage.getItem(BASE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }

/* 輕量 diff(Myers 演算法,字詞為單位,零依賴):編輯距離小則精準逐字比對;
   文件過大或差異過大(可能整篇重寫)則退回「共同前綴/後綴 + 中段整塊替換」,避免卡頓 */
/* 中英混合斷詞:中文沒有空白分字,若整段當一個 token 會讓中文 diff 幾乎沒有用(整句被當成一整塊替換)。
   拉丁字母/數字連續視為一個詞(英文行為不變),CJK 等其他字元逐字切開(讓中文 diff 也能精準到字)。 */
function tokenizeDiff(s){ return s.match(/\s+|[A-Za-z0-9_]+|[^\sA-Za-z0-9_]/g) || []; }
function prefixSuffixDiff(a, b){
  var N = a.length, M = b.length, i = 0, j = 0;
  while(i < N && i < M && a[i] === b[i]) i++;
  while(j < N - i && j < M - i && a[N-1-j] === b[M-1-j]) j++;
  var ops = [];
  for(var p = 0; p < i; p++) ops.push({ type:'eq', ai:p, bi:p });
  for(p = i; p < N - j; p++) ops.push({ type:'del', ai:p });
  for(p = i; p < M - j; p++) ops.push({ type:'ins', bi:p });
  for(p = 0; p < j; p++) ops.push({ type:'eq', ai:N-j+p, bi:M-j+p });
  return ops; }
function myersDiffCapped(a, b, maxD){
  var N = a.length, M = b.length, offset = N + M || 1, size = 2 * offset + 1;
  var v = new Array(size).fill(0), trace = [];
  for(var d = 0; d <= maxD; d++){
    trace.push(v.slice());
    for(var k = -d; k <= d; k += 2){
      var idx = k + offset, down;
      if(k === -d) down = true; else if(k === d) down = false; else down = v[idx-1] < v[idx+1];
      var x = down ? v[idx+1] : v[idx-1] + 1, y = x - k;
      while(x < N && y < M && a[x] === b[y]){ x++; y++; }
      v[idx] = x;
      if(x >= N && y >= M) return backtrackDiff(trace, N, M, offset); } }
  return null; }
function backtrackDiff(trace, N, M, offset){
  var x = N, y = M, ops = [];
  for(var d = trace.length - 1; d >= 0; d--){
    var v = trace[d], k = x - y, idx = k + offset, down;
    if(k === -d) down = true; else if(k === d) down = false; else down = v[idx-1] < v[idx+1];
    var prevK = down ? k + 1 : k - 1, prevIdx = prevK + offset;
    var prevX = v[prevIdx], prevY = prevX - prevK;
    while(x > prevX && y > prevY){ ops.push({ type:'eq', ai:x-1, bi:y-1 }); x--; y--; }
    if(d > 0){ if(down) ops.push({ type:'ins', bi:y-1 }); else ops.push({ type:'del', ai:x-1 }); }
    x = prevX; y = prevY; }
  return ops.reverse(); }
function diffWords(oldText, newText){
  var a = tokenizeDiff(oldText), b = tokenizeDiff(newText);
  var ops = null;
  if(a.length + b.length <= 20000){ ops = myersDiffCapped(a, b, Math.min(a.length + b.length, 1500)); }
  if(!ops) ops = prefixSuffixDiff(a, b);
  return { ops: ops, a: a, b: b }; }
function renderDiff(container, diff){
  container.innerHTML = '';
  var i = 0, added = 0, removed = 0;
  while(i < diff.ops.length){
    var type = diff.ops[i].type, buf = [];
    while(i < diff.ops.length && diff.ops[i].type === type){
      var tok = type === 'ins' ? diff.b[diff.ops[i].bi] : diff.a[diff.ops[i].ai];
      buf.push(tok);
      if(/\S/.test(tok)){ if(type === 'ins') added++; if(type === 'del') removed++; }
      i++; }
    var text = buf.join('');
    if(type === 'eq'){ container.appendChild(document.createTextNode(text)); }
    else{ var span = document.createElement('span'); span.className = type === 'del' ? 'dv-del' : 'dv-ins'; span.textContent = text; container.appendChild(span); } }
  return { added: added, removed: removed }; }
var diffOverlay = document.getElementById('annoDiffOverlay');
function openDiffOverlay(){
  var base = loadBaseline();
  var cur = fullText();
  if(!base){ saveBaseline(); base = { text: cur, ts: Date.now() }; }
  diffOverlay.querySelector('.pm-title').textContent = T.dvTitle;
  diffOverlay.querySelector('.pm-hint').textContent = F(T.dvHint, { d: new Date(base.ts).toLocaleString(T.dl) });
  var statsEl = diffOverlay.querySelector('.dv-stats'), bodyEl = diffOverlay.querySelector('.dv-body');
  if(base.text === cur){
    statsEl.textContent = ''; bodyEl.innerHTML = ''; var em = document.createElement('div'); em.className = 'dv-empty'; em.textContent = T.dvNoChange; bodyEl.appendChild(em);
  } else {
    var diff = diffWords(base.text, cur);
    var st = renderDiff(bodyEl, diff);
    statsEl.innerHTML = '';
    var sp1 = document.createElement('span'); sp1.className = 'dv-add'; sp1.textContent = '+' + st.added; statsEl.appendChild(sp1);
    statsEl.appendChild(document.createTextNode('  '));
    var sp2 = document.createElement('span'); sp2.className = 'dv-rem'; sp2.textContent = '-' + st.removed; statsEl.appendChild(sp2); }
  diffOverlay.querySelector('.dv-update').textContent = T.dvUpdate;
  diffOverlay.querySelector('.pm-x2').textContent = T.close;
  diffOverlay.hidden = false; }

/* 從文件本身(含目前的文字編輯)產出「傳閱版」:對方不用閱讀器也能繼續傳遞。

   正常瀏覽器開啟時引擎會清掉靜態附錄、由互動功能接管。 */
function buildStandalone(){

  var clone = document.documentElement.cloneNode(true);

  clone.querySelectorAll('.annoPrintNo,#annoStaticApp').forEach(function(el){ el.remove(); });
  clone.querySelectorAll('[contenteditable]').forEach(function(el){ el.removeAttribute('contenteditable'); });
  clone.querySelectorAll('mark.anno.flash').forEach(function(m){ m.classList.remove('flash'); });
  var bd = clone.querySelector('body'); if(bd){ bd.style.outline = ''; bd.style.outlineOffset = ''; }
  /* 標記編號+靜態對照表(以打包當下的語言呈現) */
  var sorted = annos.filter(function(a){ return !a.orphan; }).sort(function(a,b){ return a.start - b.start; });
  var icons = { y:'🟡', r:'🔴', g:'🟢', b:'🔵' };
  if(sorted.length && bd){

    var h = document.createElement('h2'); h.textContent = T.staticTitle; app.appendChild(h);
    var hint = document.createElement('div'); hint.className = 'hint';
    hint.textContent = F(T.staticHint, { n: sorted.length });
    app.appendChild(hint);
    sorted.forEach(function(a, i){
      var ms = clone.querySelectorAll('mark.anno[data-id="' + a.id + '"]');
      if(ms.length){
        var host = ms[ms.length - 1];
        if(!host.closest('svg')){                          /* 同上:烙進 SVG 會讓檔案再開時整張圖散掉 */
          var sup = document.createElement('sup'); sup.className = 'annoPrintNo'; sup.textContent = '[' + (i+1) + ']';
          host.appendChild(sup); } }
      var d = document.createElement('div'); d.className = 'sa' + (a.resolved ? ' ok' : '');
      var head = document.createElement('b');
      head.textContent = '[' + (i+1) + '] ' + icons[a.color] + ' ' + annoLabel(a) + (a.resolved ? T.resolvedMark : '');
      d.appendChild(head);
      var q = document.createElement('blockquote');
      q.textContent = a.quote.slice(0, 60) + (a.quote.length > 60 ? '…' : '');
      d.appendChild(q);
      a.thread.forEach(function(m){

        var who = document.createElement('b');
        who.textContent = (m.author || T.anon) + (m.ts ? ' · ' + new Date(m.ts).toLocaleString(T.dl, { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '') + T.sep;
        p.appendChild(who);

    bd.insertBefore(app, bd.querySelector('script')); }
  var json = JSON.stringify({ legend: LEGEND, annotations: annos }).replace(/</g, '\\u003c');
  var p = clone.querySelector('#annoPreset');
  if(p){ p.textContent = json; }
  else{
    var s = document.createElement('script'); s.type = 'application/json'; s.id = 'annoPreset'; s.textContent = json;
    var body = clone.querySelector('body') || clone;

/* 觸控裝置(手機/平板)沒有可靠的 mouseup,原本只靠 selectionchange 去抖動(350ms)顯示顏色列。
   實測(7 角色可用性測試,國二學生用手機)回報:選字後顏色列偶爾沒有立刻跳出來,要再等一下、
   再碰一次畫面才出現——350ms 的等待,加上完全沒有過渡效果,使用者會以為工具當機了。
   改成兩個觸發來源並行,不只靠 selectionchange 單一訊號:
   ① 去抖動縮短到 120ms(仍然過濾長按拖曳選取把手時的中間態,但不再讓人等到心慌)
   ② 額外監聽 touchend——手指放開的那一刻就檢查一次選取範圍,不必等 debounce 計時器到期,
     這樣一般的「長按選字→放開」就能立刻反應,只有真的在拖曳調整選取範圍時才會走 debounce。 */
var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
var selTimer = null;
document.addEventListener('selectionchange', function(){
  var s = window.getSelection();
  if(!s.rangeCount || s.isCollapsed){ bar.hidden = true; return; }
  if(coarse && !editing){ clearTimeout(selTimer); selTimer = setTimeout(showBarForSelection, 120); } });
document.addEventListener('touchend', function(e){
  if(editing || (e.target.closest && e.target.closest(UI))) return;
  clearTimeout(selTimer); selTimer = setTimeout(showBarForSelection, 50); });
window.addEventListener('scroll', function(){
  if(bar.hidden) return;
  var s = window.getSelection();
  if(!s.rangeCount || s.isCollapsed){ bar.hidden = true; return; }
  var rect = s.getRangeAt(0).getBoundingClientRect();
  if(rect.bottom < 0 || rect.top > window.innerHeight){ bar.hidden = true; return; }
  var x = Math.min(Math.max(8, rect.left + rect.width/2 - bar.offsetWidth/2), window.innerWidth - bar.offsetWidth - 8);
  var y = rect.top - 44; if(y < 8) y = rect.bottom + 8;
  bar.style.left = x + 'px'; bar.style.top = y + 'px';
}, true);
document.addEventListener('keydown', function(e){
  /* Esc 分層關閉:一次只收最上層,不要把整個面板一起關掉(實測有人因此得重新打開面板、找回原本位置) */
  if(e.key === 'Escape'){
    bar.hidden = true;
    if(!legendMenu.hidden || !exportMenu.hidden || !aiMenu.hidden){ legendMenu.hidden = true; exportMenu.hidden = true; aiMenu.hidden = true; return; }
    if(!promptOverlay.hidden){ promptOverlay.hidden = true; return; }
    if(!diffOverlay.hidden){ diffOverlay.hidden = true; return; }
    if(!pop.hidden){ closePop(); return; }
    panel.hidden = true; } });

var UIKEY = 'annoReader::panelSize';
/* 面板尺寸夾限。面板靠 right/bottom 錨定,所以「太大」等同於「左上角跑到畫面外」——
   而縮放把手就在左上角,一旦出界使用者就再也抓不到、拉不回來(實測在 1280 寬拉大後
   換到 860 寬開啟,面板左緣 -416px、把手 -417px,整個卡死)。
   關鍵是分開「使用者想要的尺寸」與「這個視窗放得下的尺寸」:wantW/wantH 保存前者、
   永遠不被夾限改寫,每次都用 min(想要, 放得下) 重算。只夾不還原的話,面板在小視窗被縮小後
   換回大螢幕會一直維持在最小尺寸回不來(第一版就是這樣錯的)。 */
var wantW = 0, wantH = 0;
try{ var ui = JSON.parse(localStorage.getItem(UIKEY) || '{}');
  wantW = ui.w || 0; wantH = ui.h || 0; }catch(e){}
/* 面板可用範圍。底部要讓開「標註」浮動鈕:CSS 原本寫死 bottom:64px,那是
   「鈕高 39 + 底距 18 + 7 餘裕」算出來的魔術數字 —— 只要瀏覽器縮放或系統字型放大讓鈕變高
   超過 46px,鈕就會壓在面板底部的說明文字上(使用者實機截圖就是這個狀況)。改成量出來再算。 */
function panelLimits(){
  var tg = document.getElementById('annoToggle');
  var bot = 18 + ((tg && tg.offsetHeight) || 39) + 8;
  return { bot: bot,
           maxW: Math.max(240, window.innerWidth - 40),
           maxH: Math.max(160, window.innerHeight - bot - 24) };
}
function clampPanelSize(){
  var L = panelLimits();
  panel.style.bottom = L.bot + 'px';
  panel.style.width = Math.min(wantW || 350, L.maxW) + 'px';   /* 350 = CSS 預設寬 */
  var hint = panel.querySelector('.ap-hint'); if(hint) hint.hidden = false;  /* 每次都先假設裝得下,重新量測 */
  if(wantH){ panel.style.height = Math.min(wantH, L.maxH) + 'px'; panel.style.maxHeight = 'none'; }
  else{
    /* 沒有存過高度:預設維持 CSS 的 62vh,但短螢幕上「首次使用(引導條還在)」時 62vh 裝不下
       標頭+引導條+篩選列+清單最小高+底部說明,所以在這個視窗放得下的範圍內,允許長到內容需要的高度。
       scrollHeight 是內容高,不受 max-height 影響;面板隱藏時為 0,開啟時本函式會再跑一次。 */
    panel.style.height = '';
    var vh62 = Math.round(window.innerHeight * 0.62);
    panel.style.maxHeight = Math.min(L.maxH, Math.max(vh62, panel.scrollHeight)) + 'px';
  }
  /* 就算長到能長的極限,還是有可能裝不下(例如使用者手動拖過的高度、或視窗矮到連清單的
     min-height 96px 都擠不進去)。#annoPanel 現在有 overflow:hidden,裝不下的內容不會再
     畫穿邊框蓋到下面的「標註」按鈕上,但會被裁切看不到。與其讓清單或篩選列被切一半,
     優先犧牲最不重要的說明文字(.ap-hint 純粹是操作提示,別處也有說明)讓出空間。 */
  /* 容錯值不能是 0:實測 scrollHeight 比 clientHeight 多算 1~2px(邊框計入方式的捨入差),
     嚴格用 > 會讓完全不影響視覺的誤差也觸發隱藏,course 犧牲說明文字太浪費。
     真正要處理的是「差一整行文字以上」的情況,6px 抓不到假警報又能抓到真的裝不下。 */
  if(hint && panel.scrollHeight - panel.clientHeight > 6) hint.hidden = true;
}
clampPanelSize();
/* 視窗被縮小時,所有用絕對座標定位的浮動元件都會失準:面板變成出界、註解視窗跟著飄出去、
   選單則還停在舊的按鈕座標上(按鈕早就移位了)。統一在這裡收拾。 */
window.addEventListener('resize', function(){
  clampPanelSize();
  if(!pop.hidden){
    var mx = Math.max(4, window.innerWidth - pop.offsetWidth - 4), my = Math.max(4, window.innerHeight - 40);
    pop.style.left = Math.min(Math.max(4, parseInt(pop.style.left, 10) || 4), mx) + 'px';
    pop.style.top  = Math.min(Math.max(4, parseInt(pop.style.top,  10) || 4), my) + 'px';
  }
  document.querySelectorAll('.anno-menu').forEach(function(m){ m.hidden = true; });  /* 座標已失準,收掉比亂貼好 */
});
/* iframe 剛載入時的寬度是過渡值(實測 1290 → 860 要約 1.7 秒才定案),這段期間夾出來的尺寸是錯的;
   而初始版面的變化不保證會發 resize 事件,單靠上面那個監聽會漏掉。用 ResizeObserver 盯著版面本身,
   讓夾限與載入時序脫鉤 —— 不管什麼時候定案都會再算一次。 */
var panelRO = null;
if(window.ResizeObserver){
  try{ panelRO = new ResizeObserver(function(){ clampPanelSize(); }); panelRO.observe(document.documentElement); }catch(e){}
}
document.getElementById('annoResize').addEventListener('mousedown', function(e){
  e.preventDefault();
  var sx = e.clientX, sy = e.clientY, sw = panel.offsetWidth, sh = panel.offsetHeight;
  function mv(ev){
    var L = panelLimits();                                     /* 與 clampPanelSize 共用同一組上限 */
    var w = Math.min(Math.max(260, sw + (sx - ev.clientX)), L.maxW);
    var h = Math.min(Math.max(180, sh + (sy - ev.clientY)), L.maxH);
    panel.style.width = w + 'px'; panel.style.height = h + 'px'; panel.style.maxHeight = 'none'; }
  function up(){
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
    wantW = panel.offsetWidth; wantH = panel.offsetHeight;   /* 使用者剛拉出來的就是新的目標尺寸 */
    try{ localStorage.setItem(UIKEY, JSON.stringify({ w: wantW, h: wantH })); }catch(e){} }
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up); });

applyI18n();

renderAll();

/* 清理文件:移除 script、事件屬性、javascript: 連結、殘留的舊標註介面 */
/* 把舊引擎的 CSS 規則從一段樣式文字裡拆掉。

   為什麼不用單一 regex:原本寫成 /(^|})\s*[^{}]*(?:#anno|…)[^{}]*\{[^}]*\}/,
   選擇器前面那段 [^{}]* 跨不過 "@media …{" 的左大括號,所以**寫在 @media 裡的規則永遠掃不到**。
   實測一份舊版匯出的檔案殘留 27 條規則,全部在 @media(深色模式/列印/pointer:coarse)內,
   其中那條舊的 @media print{#annoStaticApp{display:none}} 還會反過來抵銷新引擎的列印修正。
   而且原本的樣式清單漏了 .annoPrintNo、.anno-menu、.anno-modal-* 這幾族,根本沒列進去。

   改成自己數大括號、遞迴進 at-rule。#anno / .anno 後面要求接大寫字母或連字號,
   避免誤刪文件自己的 .announcement 之類的 class。 */
function stripAnnoRules(css){
  /* 這條要涵蓋引擎的每一族選擇器。實測方式:把 ENGINE_CSS 的 164 條選擇器全部跑過一次,
     一條都不能漏 —— 先前漏了 .fchip/.cdot/.dv-* 這幾族,結果它們在使用者檔案裡永遠清不掉。
     反向也測過 30 個一般文件會用的選擇器(.hint/.note/.badge/.announcement/.app-bar…)零誤判:
     精準度靠 #anno/.anno 後面必須接大寫字母或連字號,以及 \.ap- 這種「點號緊貼前綴」的寫法。
     不要加 .m/.q/.ok/.sa/.note 這類泛用 class —— 它們在引擎裡一律掛在容器底下,
     上面的規則已經涵蓋,單獨列出反而會誤刪使用者文件自己的樣式。 */
  var SEL = /(?:[#.]anno(?=[A-Z-])|mark\.anno|\.(?:ap|ug|dv|pm|ob|lm)-|\.(?:fchip|fclab|foic|frow|cdot|bdot|fdot|sugline)\b|button\.c-[yrgb]|\.dot\.c-[yrgb])/;
  function walk(t){
    var out = '', i = 0;
    while(i < t.length){
      var open = t.indexOf('{', i);
      if(open < 0){ out += t.slice(i); break; }
      var head = t.slice(i, open);
      var depth = 1, j = open + 1;
      while(j < t.length && depth){                       /* 找到這一塊真正的結尾 */
        if(t[j] === '{') depth++; else if(t[j] === '}') depth--;
        j++; }
      var body = t.slice(open + 1, j - 1);
      if(head.indexOf('@') >= 0){                          /* at-rule:遞迴清內部 */
        var inner = walk(body);
        if(inner.trim()) out += head + '{' + inner + '}';   /* 內容被清空的 @media 整塊丟掉 */
      } else if(!SEL.test(head)){
        out += head + '{' + body + '}';
      }
      i = j; }
    return out; }
  return walk(css);
}

function cleanDocument(html){

  html = html.replace(/<sup class="annoPrintNo">[^<]*<\/sup>/g, '');
  var doc = new DOMParser().parseFromString(html, 'text/html');
  /* 舊檔案在 SVG 裡留下的 mark 一律拆掉(它們本來就渲染不出來);標註資料仍在 annoPreset,
     留言不會掉,只是那幾則之後會列為找不到位置。 */
  doc.querySelectorAll('svg mark.anno').forEach(function(m){
    var par = m.parentNode; while(m.firstChild) par.insertBefore(m.firstChild, m); par.removeChild(m); });
  /* 內嵌的標記資料(純 JSON,不會執行)保留,交給引擎合併;其餘 script 全部移除 */
  doc.querySelectorAll('script').forEach(function(s){
    if(s.id === 'annoPreset' && s.type === 'application/json') return;
    s.remove(); });
  /* 文件帶著舊版引擎 CSS 時會跟新注入的樣式打架。v4.1 起引擎樣式帶 id,可以整塊移除;
     更早匯出的檔案沒有 id,只能逐條掃 —— 見 stripAnnoRules 的說明。 */
  doc.querySelectorAll('style#annoEngineCss').forEach(function(st){ st.remove(); });
  doc.querySelectorAll('style').forEach(function(st){
    /* 只碰明顯是引擎產出的樣式塊。不能只認 #annoBar:被舊版清過一半的區塊裡
       #annoBar 早就沒了,只剩 .fchip/.dv-stats 這些,再匯入時就會被整個跳過、永遠殘留。 */
    if(!/#anno[A-Z]|mark\.anno|\.ap-|\.fchip|\.dv-stats|\.pm-head/.test(st.textContent)) return;
    var t = stripAnnoRules(st.textContent);
    if(t.trim()) st.textContent = t; else st.remove(); });
  ['annoBar','annoPop','annoPanel','annoToggle','annoFile','annoResize','annoPrintApp','annoStaticApp','annoPromptOverlay','annoDiffOverlay','annoLegendMenu','annoExportMenu','annoAiMenu','annoToast'].forEach(function(id){
    var el = doc.getElementById(id); if(el) el.remove(); });
  doc.querySelectorAll('.annoPrintNo').forEach(function(el){ el.remove(); });
  doc.querySelectorAll('*').forEach(function(el){
    Array.prototype.slice.call(el.attributes).forEach(function(at){
      if(/^on/i.test(at.name)) el.removeAttribute(at.name);
      if((at.name === 'href' || at.name === 'src') && /^\s*javascript:/i.test(at.value)) el.removeAttribute(at.name); }); });
  return { doc: doc };
}

function buildInjection(key, name){
  return '<style id="annoEngineCss">' + ENGINE_CSS + '</style>' + ENGINE_UI +
    '<scr' + 'ipt>window.__ANNO_KEY=' + JSON.stringify(key) + ';window.__ANNO_NAME=' + JSON.stringify(name) + '</scr' + 'ipt>' +
    '<scr' + 'ipt>(' + ENGINE.toString() + ')()</scr' + 'ipt>';
}

function loadDoc(name, html){
  var c = cleanDocument(html);
  var key = docKey(name, c.doc);
  /* 分配書 v6.3 檔案內建標註功能存的舊標記 → 自動搬進閱讀器(同瀏覽器才搬得到;逐筆比對不重複,尊重刪除紀錄) */
  try{
    var legacy = localStorage.getItem('agenthub-anno-v6.3');
    if(legacy && /工作總分配書/.test(c.doc.title || '')){
      var la = JSON.parse(legacy) || [];
      if(la.length){
        var cur = []; try{ cur = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){}
        var dead = {}; try{ (JSON.parse(localStorage.getItem(key + '::del') || '[]')).forEach(function(i){ dead[i] = 1; }); }catch(e){}
        var ids = {}; cur.forEach(function(a){ ids[a.id] = 1; });
        var added = 0;
        la.forEach(function(a){ if(a && a.quote != null && !ids[a.id] && !dead[a.id]){ cur.push(a); added++; } });
        if(added){ localStorage.setItem(key, JSON.stringify(cur)); }
      }
    }
  }catch(e){}
  var cleanHTML = '<!doctype html>\n' + c.doc.documentElement.outerHTML;
  current = { key: key, name: name, cleanHTML: cleanHTML };
  /* 寫入 iframe 並注入標註引擎 */
  var writeHTML = /<\/body>/i.test(cleanHTML)
    ? cleanHTML.replace(/<\/body>/i, buildInjection(key, name) + '</body>')
    : cleanHTML + buildInjection(key, name);
  var idoc = view.contentDocument;
  idoc.open(); idoc.write(writeHTML); idoc.close();
  document.body.classList.add('reading');
  document.getElementById('docName').textContent = name;
  document.getElementById('btnHome').hidden = false;
  saveRecent(name, key, html);
}

function saveRecent(name, key, html){
  var r = getRecents().filter(function(x){ return x.key !== key; });
  var hasContent = html.length <= MAX_CONTENT;
  r.unshift({ key: key, name: name, ts: Date.now(), hasContent: hasContent });
  while(r.length > MAX_RECENTS){
    var old = r.pop();
    try{ localStorage.removeItem(DOC_PREFIX + old.key); }catch(e){}
  }
  if(hasContent){ try{ localStorage.setItem(DOC_PREFIX + key, html); }catch(e){
    r[0].hasContent = false; try{ localStorage.removeItem(DOC_PREFIX + key); }catch(e2){} } }
  setRecents(r);
  renderRecents();
}

function clearAllRecents(){
  var r = getRecents();
  if(!r.length) return;
  if(!confirm(SF(ST.confirmClearAll, { n: r.length }))) return;
  r.forEach(function(item){
    try{ localStorage.removeItem(DOC_PREFIX + item.key); localStorage.removeItem(item.key); }catch(e){} });
  setRecents([]);
  renderRecents();
}
function renderRecents(){
  var box = document.getElementById('recents');
  var r = getRecents();
  box.innerHTML = '';
  if(!r.length) return;
  /* 標題與「清除全部」放同一列;下面補一行說明這份清單只存在這台瀏覽器裡 —— 有使用者
     (實測:上班族、工程師、企業主)在公用電腦或多分頁情境下看到陌生檔名,一度以為資料外洩
     或跟別人的混在一起,說明文字+一鍵清除入口讓人有辦法自己處理,不必乾等或不敢再點。 */
  var head = document.createElement('div'); head.className = 'rec-head';
  var h = document.createElement('h3'); h.textContent = ST.recents; head.appendChild(h);
  var clearBtn = document.createElement('button'); clearBtn.className = 'clearall';
  clearBtn.textContent = ST.clearAll; clearBtn.title = ST.clearAllTitle;
  clearBtn.addEventListener('click', clearAllRecents);
  head.appendChild(clearBtn);
  box.appendChild(head);
  var hint = document.createElement('p'); hint.className = 'rec-hint'; hint.textContent = ST.recentsHint;
  box.appendChild(hint);
  r.forEach(function(item){
    var d = document.createElement('div'); d.className = 'rec';
    var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = item.name; d.appendChild(nm);
    var annoCount = 0;
    try{ annoCount = (JSON.parse(localStorage.getItem(item.key) || '[]')).length; }catch(e){}
    var meta = document.createElement('span'); meta.className = 'meta';
    meta.textContent = '🖍 ' + annoCount + ' · ' + new Date(item.ts).toLocaleDateString();
    d.appendChild(meta);
    if(!item.hasContent){
      var nf = document.createElement('span'); nf.className = 'nofile'; nf.textContent = ST.tooBig; d.appendChild(nf); }
    var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕'; del.title = ST.delTitle;
    del.addEventListener('click', function(e){
      e.stopPropagation();
      if(!confirm(SF(ST.confirmRemove, { name: item.name, n: annoCount }))) return;
      try{ localStorage.removeItem(DOC_PREFIX + item.key); localStorage.removeItem(item.key); }catch(e2){}
      setRecents(getRecents().filter(function(x){ return x.key !== item.key; }));
      renderRecents(); });
    d.appendChild(del);
    d.addEventListener('click', function(){
      var html = null;
      try{ html = localStorage.getItem(DOC_PREFIX + item.key); }catch(e){}
      if(html) loadDoc(item.name, html);
      else { alert(ST.reopenAlert); pickFile(); } });
    box.appendChild(d); });
}

/* 下載傳閱版:交給文件內的引擎產出(會帶著文字編輯+標記+圖例) */
window.__buildAnnotated = function(){
  var w = view.contentWindow;
  return (w && w.__annoBuild) ? w.__annoBuild() : null; }; /* 供測試 */
window.__loadDoc = loadDoc; /* 供測試 */

document.getElementById('btnHome').addEventListener('click', function(){
  document.body.classList.remove('reading');
  document.getElementById('docName').textContent = '';
  document.getElementById('btnHome').hidden = true;
  current = null;
  renderRecents(); });

var fi = document.getElementById('fileIn');
function pickFile(){ fi.click(); }
document.getElementById('btnOpen').addEventListener('click', pickFile);
document.getElementById('drop').addEventListener('click', pickFile);
fi.addEventListener('change', function(){
  var f = fi.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ loadDoc(f.name, rd.result); };
  rd.readAsText(f); fi.value = ''; });

var drop = document.getElementById('drop');
['dragover','dragenter'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
['dragleave','drop'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
document.addEventListener('drop', function(e){
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  if(!/\.html?$/i.test(f.name) && f.type !== 'text/html'){ alert(ST.htmlOnly); return; }
  var rd = new FileReader();
  rd.onload = function(){ loadDoc(f.name, rd.result); };
  rd.readAsText(f); });

/* ---- 「我沒有 HTML 檔」:①貼上文字/HTML 直接開始 ②教怎麼從 Word/Google 文件/PDF 轉出 ---- */
var pasteOv = document.getElementById('pasteOv'), pasteTA = document.getElementById('pasteTA'), pasteName = document.getElementById('pasteName');
function openPaste(){
  pasteOv.hidden = false;
  pasteTA.value = ''; pasteName.value = '';
  pasteOv.querySelector('.perr').textContent = '';
  pasteTA.focus(); }
function closePaste(){ pasteOv.hidden = true; }
document.getElementById('btnPaste').addEventListener('click', openPaste);
pasteOv.querySelector('.px').addEventListener('click', closePaste);
pasteOv.querySelector('.pcancel').addEventListener('click', closePaste);
pasteOv.addEventListener('click', function(e){ if(e.target === pasteOv) closePaste(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !pasteOv.hidden) closePaste(); });
document.getElementById('btnHowto').addEventListener('click', function(){
  var h = document.getElementById('howto'); h.hidden = !h.hidden;
  if(!h.hidden) h.scrollIntoView({ block:'nearest' }); });
/* 產品頁的「沒有 HTML 檔?直接貼上文字」連結指到這裡(htmlscope.html#paste),讓它真的
   直接開貼字視窗 —— 實測(大學生)回報:點下去以為會跳出貼字框,結果落地頁只是捲動到
   說明文字,沒有真的能貼字的欄位,連結字面意思跟行為不符。 */
if(location.hash === '#paste'){
  openPaste();
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
}
/* 貼上的內容轉成可標註的文件:看起來像 HTML 就當 HTML,否則把純文字包成段落 */
function htmlFromPaste(title, raw){
  var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var looksHtml = /<\s*(!doctype|html|body|div|p|h[1-6]|table|article|section|ul|ol|span)\b/i.test(raw);
  if(looksHtml){
    var out = raw;
    if(!/<title>/i.test(out)){
      if(/<head[^>]*>/i.test(out)) out = out.replace(/<head([^>]*)>/i, '<head$1><title>' + esc(title) + '</title>');
      else out = '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title></head><body>' + out + '</body></html>'; }
    return out; }
  var body = raw.split(/\n\s*\n/).map(function(p){
    return '<p>' + esc(p.trim()).replace(/\n/g, '<br>') + '</p>'; }).join('\n');
  return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
    '<style>body{max-width:760px;margin:0 auto;padding:36px 22px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.9;color:#1c2321}h1,h2,h3{line-height:1.35}</style>' +
    '</head><body><h1>' + esc(title) + '</h1>' + body + '</body></html>'; }
pasteOv.querySelector('.pgo').addEventListener('click', function(){
  var raw = pasteTA.value.trim(), err = pasteOv.querySelector('.perr');
  if(!raw){ err.textContent = ST.pasteErrEmpty; pasteTA.focus(); return; }
  var title = pasteName.value.trim();
  if(!title){                                  /* 沒填標題就用第一行當標題(標題是標記存取的索引,不能空) */
    title = raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40) || ST.pasteFallbackTitle; }
  closePaste();
  loadDoc(title + '.html', htmlFromPaste(title, raw)); });

applyShellLang();
})();
